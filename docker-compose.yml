services:
  db:
    image: postgres:16-alpine
    container_name: tamil-event-discovery-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-event_discovery}
      POSTGRES_USER: ${POSTGRES_USER:-event_discovery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-event_discovery} -d ${POSTGRES_DB:-event_discovery}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: tamil-event-discovery-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-event_discovery}:${POSTGRES_PASSWORD:-change_me_local_only}@db:5432/${POSTGRES_DB:-event_discovery}
      CORS_ORIGINS: http://localhost:5173
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-true}
      DISCOVERY_INTERVAL_MINUTES: ${DISCOVERY_INTERVAL_MINUTES:-60}
      DISCOVERY_REQUEST_TIMEOUT: ${DISCOVERY_REQUEST_TIMEOUT:-15}
      DISCOVERY_MAX_PAGES_PER_SOURCE: ${DISCOVERY_MAX_PAGES_PER_SOURCE:-10}
      DISCOVERY_MAX_CONCURRENT_SOURCES: ${DISCOVERY_MAX_CONCURRENT_SOURCES:-3}
      DISCOVERY_USER_AGENT: ${DISCOVERY_USER_AGENT:-TamilEventDiscoveryBot/1.0 (+https://github.com/karthi281104/Discovery_projects)}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    container_name: tamil-event-discovery-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-event_discovery}:${POSTGRES_PASSWORD:-change_me_local_only}@db:5432/${POSTGRES_DB:-event_discovery}
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-secret}
      DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-true}
      DISCOVERY_INTERVAL_MINUTES: ${DISCOVERY_INTERVAL_MINUTES:-60}
      DISCOVERY_REQUEST_TIMEOUT: ${DISCOVERY_REQUEST_TIMEOUT:-15}
      DISCOVERY_MAX_PAGES_PER_SOURCE: ${DISCOVERY_MAX_PAGES_PER_SOURCE:-10}
      DISCOVERY_MAX_CONCURRENT_SOURCES: ${DISCOVERY_MAX_CONCURRENT_SOURCES:-3}
      DISCOVERY_USER_AGENT: ${DISCOVERY_USER_AGENT:-TamilEventDiscoveryBot/1.0 (+https://github.com/karthi281104/Discovery_projects)}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build: ./frontend
    container_name: tamil-event-discovery-web
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
