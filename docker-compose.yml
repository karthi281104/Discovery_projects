services:
  db:
    image: postgres:16-alpine
    container_name: tamil-event-discovery-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-event_discovery}
      POSTGRES_USER: ${POSTGRES_USER:-event_discovery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-event_discovery} -d ${POSTGRES_DB:-event_discovery}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: tamil-event-discovery-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-event_discovery}:${POSTGRES_PASSWORD:-change_me_local_only}@db:5432/${POSTGRES_DB:-event_discovery}
      CORS_ORIGINS: http://localhost:5173
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    container_name: tamil-event-discovery-web
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
