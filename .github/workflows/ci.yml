name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend Tests & PostgreSQL Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: event_discovery_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic migrations on PostgreSQL (upgrade -> downgrade -> upgrade)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/event_discovery_test
          PYTHONPATH: backend
        run: |
          cd backend
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run pytest (Unit, API, and PostgreSQL migration validation)
        env:
          CI: "true"
          PYTHONPATH: backend
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/event_discovery_test
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/event_discovery_test
          SECRET_KEY: ci-test-secret-key-that-is-at-least-32-chars-long
          APP_ENV: test
        run: |
          pytest backend/tests -v

  frontend:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend unit and component tests
        run: |
          cd frontend
          npm test

      - name: Run TypeScript type check and Vite production build
        run: |
          cd frontend
          npm run build

